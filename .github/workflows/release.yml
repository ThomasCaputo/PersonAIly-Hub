name: Release

# Pushing a tag like v0.1.0 builds the Windows installer on GitHub's servers
# and attaches it to a draft release. Nothing is published until the draft is
# reviewed and published by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: rustup show

      - run: npm ci

      - name: Check that the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != app version $version" }

      - name: Build installer and portable exe
        shell: pwsh
        run: ./scripts/release.ps1

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --draft --title "PersonAIly Hub ${{ github.ref_name }}" --generate-notes
