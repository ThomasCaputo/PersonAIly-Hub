name: Release

# Pushing a tag like v0.1.0 builds the Windows installer on GitHub's servers
# and attaches it to a draft release. Nothing is published until the draft is
# reviewed and published by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    # Authenticode with SignPath, only once the project has these secrets
    # (see scripts/sign.ps1). Without them the build continues unsigned.
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_POLICY_SLUG: ${{ secrets.SIGNPATH_POLICY_SLUG }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: rustup show

      - run: npm ci

      - name: Check that the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != app version $version" }

      - name: Install the SignPath module
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        run: Install-Module -Name SignPath -Force -Scope CurrentUser

      - name: Build installer and portable exe
        shell: pwsh
        env:
          # Signs the installer for the in-app updater (see CONTRIBUTING.md).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/release.ps1

      # The notes come from the CHANGELOG section of this version, the same text
      # the in-app updater shows (written by release.ps1, outside release/).
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --draft --title "PersonAIly Hub ${{ github.ref_name }}" --notes-file target/release-notes.md
