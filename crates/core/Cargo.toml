[package]
name = "app-core"
description = "Nucleo dell'app: provider, modelli locali, strumenti, agenti, archivio"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
reqwest = { version = "0.13.5", features = ["json", "native-tls"], default-features = false }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "sync", "time", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }

[target."cfg(windows)".dependencies]
win32job = "2.1.0"
