[package]
name = "app-core"
description = "Nucleo dell'app: provider, modelli locali, strumenti, agenti, archivio"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
keyring = "4.2.0"
reqwest = { version = "0.13.5", features = ["json", "native-tls"], default-features = false }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.40.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "sync", "time", "rt", "macros"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }

[target."cfg(windows)".dependencies]
win32job = "2.1.0"
windows-sys = { version = "0.61.2", features = ["Win32_System_Performance", "Win32_Foundation"] }
