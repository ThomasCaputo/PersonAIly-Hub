[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
app-core = { path = "crates/core" }

# Ottimizzazioni per la versione distribuita: eseguibile più piccolo.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
