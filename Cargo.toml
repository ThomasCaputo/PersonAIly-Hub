[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "apps/desktop/src-tauri"]

[workspace.package]
version = "1.3.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
app-core = { path = "crates/core" }
app-server = { path = "crates/server" }

# Ottimizzazioni per la versione distribuita: eseguibile più piccolo.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# "unwind" e non "abort": un panic in una libreria (per esempio la lettura
# di un PDF rovinato) deve diventare un errore, non chiudere l'app.
panic = "unwind"
strip = true
