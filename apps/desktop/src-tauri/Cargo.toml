[package]
name = "desktop"
description = "App desktop: finestra Tauri che usa il nucleo"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# Il suffisso `_lib` evita su Windows il conflitto di nome con l'eseguibile
# (https://github.com/rust-lang/cargo/issues/8519).
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
app-core.workspace = true
app-server.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.4"
tokio = { version = "1.54.1", features = ["sync"] }
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.3"
tauri-plugin-updater = "2"
